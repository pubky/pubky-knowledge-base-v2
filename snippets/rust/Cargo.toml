[package]
name = "pubky-doc-snippets"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
pubky = { version = "=0.13.0", features = ["json"] }
serde_json = "1.0"

[lints.clippy]
pedantic = { level = "allow", priority = -1 }
all = { level = "warn", priority = -1 }
