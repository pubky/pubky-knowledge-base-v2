[package]
name = "pubky-doc-snippets"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
pubky = { version = "=0.9.0", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
futures-util = "0.3"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

[lints.clippy]
pedantic = { level = "allow", priority = -1 }
all = { level = "warn", priority = -1 }
