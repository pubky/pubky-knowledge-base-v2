name: Check code snippets

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    name: JS/TS snippets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            snippets/js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate snippet references
        run: npm run check:snippet-fences

      - name: Install (vanilla JS)
        working-directory: snippets/js
        run: npm ci

      - name: Validate snippets (vanilla JS)
        working-directory: snippets/js
        run: npm run check

      - name: Build and validate documentation
        run: npm run build
