name: Check code snippets

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust snippets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: snippets/rust

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Validate snippets
        run: npm run check:snippets:rust

  js:
    name: JS/TS snippets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate snippet references
        run: npm run check:snippet-fences

      - name: Install (vanilla JS)
        working-directory: snippets/js
        run: npm install

      - name: Validate snippets (vanilla JS)
        working-directory: snippets/js
        run: npm run check

      - name: Install (React Native)
        working-directory: snippets/react-native
        run: npm install --legacy-peer-deps

      - name: Validate snippets (React Native)
        working-directory: snippets/react-native
        run: npm run check
