name: Deploy to Cloud Run

on:
  workflow_run:
    workflows: ["Check code snippets"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: europe-west6-docker.pkg.dev/infra-464608/synonym-private-repo
  IMAGE: pubky-org
  REGION: europe-west6
  SERVICE: pubky-org
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://pubky.org
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check snippets for manual deployments
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm --prefix snippets/js ci
          npm run check:snippets

      - run: npm run build

      - uses: ./.github/actions/check-live-links

      - uses: pubky/ci-workflows/.github/actions/docker/registry_login@main
        with:
          registry: ${{ env.REGISTRY }}
          gcp_service_account_key: ${{ secrets.GRC_INFRA_READ_WRITE }}

      - uses: pubky/ci-workflows/.github/actions/docker/build_and_push@main
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ env.IMAGE }}
          context: .
          cache_from: type=gha
          cache_to: type=gha,mode=max

      - uses: pubky/ci-workflows/.github/actions/cloudrun/deploy@main
        with:
          gcp_service_account_key: ${{ secrets.CLOUDRUN_INFRA }}
          region: ${{ env.REGION }}
          service: ${{ env.SERVICE }}
          image: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}
          flags: >-
            --port=8080
            --ingress=internal-and-cloud-load-balancing
            --allow-unauthenticated
            --max-instances=3
